server:
  port: ${PXCZXN_SERVER_PORT:8849}

spring:
  application:
    name: pxczxn-community
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PXCZXN_DB_URL}
    username: ${PXCZXN_DB_USERNAME}
    password: ${PXCZXN_DB_PASSWORD}
    hikari:
      minimum-idle: ${PXCZXN_DB_MIN_IDLE:5}
      maximum-pool-size: ${PXCZXN_DB_MAX_POOL_SIZE:20}
      connection-timeout: ${PXCZXN_DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: 5000
  data:
    redis:
      host: ${PXCZXN_REDIS_HOST}
      port: ${PXCZXN_REDIS_PORT:6379}
      password: ${PXCZXN_REDIS_PASSWORD}
      database: ${PXCZXN_REDIS_DATABASE:10}
      lettuce:
        pool:
          max-active: ${PXCZXN_REDIS_MAX_ACTIVE:16}
          max-wait: ${PXCZXN_REDIS_MAX_WAIT:5s}
          max-idle: ${PXCZXN_REDIS_MAX_IDLE:8}
          min-idle: ${PXCZXN_REDIS_MIN_IDLE:2}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: top.pxczxn.platform.common.entity,top.pxczxn.platform.system.entity,top.pxczxn.platform.file.entity,top.pxczxn.platform.gen.entity,top.pxczxn.platform.message.entity,top.pxczxn.platform.mall.entity,top.pxczxn.platform.job.entity,top.pxczxn.platform.biz.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

pxczxn:
  demo-mode: false
  features:
    scaffold:
      payment: false
      sms: false
      wechat: false
      social-login: false
      chat: ${PXCZXN_FEATURE_CHAT:false}
      ssh-server: false
      codegen: false
      samples: false
  community:
    version: ${PXCZXN_COMMUNITY_VERSION:1.0.0}
  security:
    cors:
      allowed-origins: ${PXCZXN_CORS_ALLOWED_ORIGINS}
  websocket:
    ticket:
      ttl: 30s
      require-redis: true

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      enabled: true
      show-details: never
    info:
      enabled: true
    prometheus:
      enabled: true
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: info
    top.pxczxn: info
