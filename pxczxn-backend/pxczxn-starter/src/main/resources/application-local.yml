server:
  port: 8849

spring:
  application:
    name: pxczxn-community
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PXCZXN_DB_URL:jdbc:mysql://localhost:3306/mars-system?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=UTC}
    username: ${PXCZXN_DB_USERNAME:root}
    password: ${PXCZXN_DB_PASSWORD:root}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 20
      connection-timeout: 30000
      validation-timeout: 5000
  data:
    redis:
      host: ${PXCZXN_REDIS_HOST:localhost}
      port: ${PXCZXN_REDIS_PORT:6379}
      password: ${PXCZXN_REDIS_PASSWORD:}
      database: ${PXCZXN_REDIS_DATABASE:6}
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: top.pxczxn.platform.common.entity,top.pxczxn.platform.system.entity,top.pxczxn.platform.file.entity,top.pxczxn.platform.gen.entity,top.pxczxn.platform.message.entity,top.pxczxn.platform.mall.entity,top.pxczxn.platform.job.entity,top.pxczxn.platform.biz.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

pxczxn:
  demo-mode: false
  community:
    version: 1.0.0
  local-admin:
    username: ${PXCZXN_LOCAL_ADMIN_USERNAME:admin}
    password: ${PXCZXN_LOCAL_ADMIN_PASSWORD:admin123}
  security:
    cors:
      allowed-origins:
        - http://localhost:8847
        - http://127.0.0.1:8847
        - http://localhost:8848
        - http://127.0.0.1:8848
  websocket:
    ticket:
      ttl: 30s
      require-redis: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

logging:
  level:
    top.pxczxn.platform: debug
    top.pxczxn.community: debug
