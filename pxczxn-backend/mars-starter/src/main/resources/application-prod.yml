server:
  port: 8849

spring:
  application:
    name: mars-admin
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PXCZXN_DB_URL}
    username: ${PXCZXN_DB_USERNAME}
    password: ${PXCZXN_DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${PXCZXN_DRUID_USERNAME}
        login-password: ${PXCZXN_DRUID_PASSWORD}
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      filter:
        stat:
          enabled: true
  data:
    redis:
      host: ${PXCZXN_REDIS_HOST}
      port: ${PXCZXN_REDIS_PORT:6379}
      password: ${PXCZXN_REDIS_PASSWORD:}
      database: ${PXCZXN_REDIS_DATABASE:10}
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.mars.common.entity,com.mars.system.entity,com.mars.file.entity,com.mars.gen.entity,com.mars.message.entity,com.mars.mall.entity,com.mars.job.entity,com.mars.biz.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0


# ======================== 应用配置 ========================
mars:
  # 演示模式配置（此处为开发环境默认值，生产环境请在 application-prod.yml 中配置）
  # true: 开启演示模式，禁止新增、编辑、删除操作
  # false: 关闭演示模式，允许所有操作
  demo-mode: true

# 日志配置
logging:
  level:
    com.mars: debug
