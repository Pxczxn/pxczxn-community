groups:
  - name: pxczxn-platform
    rules:
      - alert: BackendUnavailable
        expr: up{job="pxczxn-backend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Community backend is unreachable" }
      - alert: HttpServerErrorRateHigh
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "5xx rate exceeds 5%" }
      - alert: MysqlUnavailable
        expr: mysql_up == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "MySQL exporter cannot query MySQL" }
      - alert: RedisUnavailable
        expr: redis_up == 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Redis exporter cannot query Redis" }
      - alert: HostDiskAlmostFull
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.15
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Host disk free space is below 15%" }
      - alert: HostMemoryPressure
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Host available memory is below 10%" }
