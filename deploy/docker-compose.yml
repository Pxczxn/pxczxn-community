services:
  mysql:
    image: mysql:8.0.44
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &default_logging
      driver: local
      options: { max-size: "10m", max-file: "5" }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default_logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
    logging: *default_logging

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PXCZXN_SERVER_PORT: 8849
      PXCZXN_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=UTC
      PXCZXN_DB_USERNAME: ${MYSQL_USER}
      PXCZXN_DB_PASSWORD: ${MYSQL_PASSWORD}
      PXCZXN_REDIS_HOST: redis
      PXCZXN_REDIS_PORT: 6379
      PXCZXN_REDIS_PASSWORD: ${REDIS_PASSWORD}
      PXCZXN_REDIS_DATABASE: 10
      PXCZXN_CORS_ALLOWED_ORIGINS: ${PXCZXN_CORS_ALLOWED_ORIGINS:?set PXCZXN_CORS_ALLOWED_ORIGINS}
      PXCZXN_LOCAL_ADMIN_USERNAME: ${PXCZXN_LOCAL_ADMIN_USERNAME:?set PXCZXN_LOCAL_ADMIN_USERNAME}
      PXCZXN_LOCAL_ADMIN_PASSWORD: ${PXCZXN_LOCAL_ADMIN_PASSWORD:?set PXCZXN_LOCAL_ADMIN_PASSWORD}
      PXCZXN_COMMUNITY_VERSION: ${PXCZXN_COMMUNITY_VERSION:-1.0.0}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *default_logging

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_COMMUNITY_API_BASE_URL: https://${APP_DOMAIN:?set APP_DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    logging: *default_logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ${LETSENCRYPT_DIR:-./letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT:-./certbot-www}:/var/www/certbot:ro
    depends_on:
      backend: { condition: service_healthy }
      web: { condition: service_healthy }
    logging: *default_logging

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${MYSQL_USER}:${MYSQL_PASSWORD}@(mysql:3306)/
    depends_on:
      mysql: { condition: service_healthy }
    logging: *default_logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis: { condition: service_healthy }
    logging: *default_logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: [--path.rootfs=/host]
    volumes:
      - /:/host:ro,rslave
    logging: *default_logging

  prometheus:
    image: prom/prometheus:v3.4.2
    restart: unless-stopped
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=30d]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      backend: { condition: service_healthy }
      mysqld-exporter: { condition: service_started }
      redis-exporter: { condition: service_started }
      node-exporter: { condition: service_started }
    logging: *default_logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    logging: *default_logging

volumes:
  mysql_data:
  redis_data:
  minio_data:
  prometheus_data:
  alertmanager_data:
